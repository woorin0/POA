name: POA P0 immutable exchange-account binding adversarial Mock audit

on:
  pull_request:
    branches: [audit/p0-dedicated-read-credentials-20261107]
    paths:
      - '.github/workflows/p0_immutable_account_binding_audit.yml'
      - 'audit_artifacts/readonly_credentials/**'

permissions:
  contents: read

jobs:
  immutable-binding-mock:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      POA_EXCHANGE_FILL_CONFIRMATION_ENABLED: 'false'
      VERIFIED_DISCORD_ALERTS: 'false'
      DISCORD_OUTBOX_ENABLED: 'false'
    steps:
      - name: Preserve exact Git bytes
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Immutable product SHA and Git Tree; copy audit-only files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = 'ad88384b8b6030c1109843b09b6761395b3f2d1c'
          $tree = '663c82e1134f592beb9c8bc652daccc7b2185975'
          $root = Join-Path $env:RUNNER_TEMP 'poa-p0-account-binding-product'
          git worktree add --detach $root $pin
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_CHECKOUT_FAILED' }
          $actual = (git -C $root rev-parse HEAD).Trim()
          $actualTree = (git -C $root rev-parse 'HEAD^{tree}').Trim()
          if ($actual -ne $pin -or $actualTree -ne $tree) { throw 'PRODUCT_PIN_INVALID' }
          if (@(git -C $root status --porcelain --untracked-files=no).Count -ne 0) {
            throw 'PRODUCT_DIRTY'
          }
          $rel = 'audit_artifacts/readonly_credentials'
          $folder = Join-Path $root $rel
          if (Test-Path $folder) { throw 'AUDIT_FOLDER_ALREADY_IN_PRODUCT' }
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          foreach ($name in @('isolated_broker.py','test_broker.py','immutable_binding.py','test_immutable_binding.py')) {
            $source = Join-Path (Join-Path $env:GITHUB_WORKSPACE $rel) $name
            Copy-Item -LiteralPath $source -Destination $folder
          }
          if (@(git -C $root diff --name-only).Count -ne 0) {
            throw 'TRACKED_PRODUCT_CHANGED'
          }
          "POA_BINDING_PRODUCT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "IMMUTABLE_BINDING_PRODUCT_SHA=$actual"
          Write-Host "IMMUTABLE_BINDING_PRODUCT_TREE=$actualTree"
          Write-Host 'BINDING_AUDIT_PRODUCT_MODIFICATIONS=0'

      - name: Install synthetic test requirements (no real exchange credentials)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install pip==26.3 setuptools==84.2.1
          if ($LASTEXITCODE -ne 0) { throw 'PIP_BOOTSTRAP_FAILED' }
          python -m pip install -r (Join-Path $env:POA_BINDING_PRODUCT 'requirements.txt')
          if ($LASTEXITCODE -ne 0) { throw 'PRODUCT_DEPS_FAILED' }
          python -m pip install pytest==9.1.1 cryptography
          if ($LASTEXITCODE -ne 0) { throw 'AUDIT_DEPS_FAILED' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'DEP_CONFLICT' }

      - name: PR15 dedicated read-key original Mock regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:POA_BINDING_PRODUCT
          try {
            python -B -c "import sys;sys.path.insert(0,'release_checks');import isolation,pytest;sys.exit(pytest.main(['-q','--tb=short','-p','no:cacheprovider','--confcutdir=audit_artifacts/readonly_credentials','--junitxml=read-keys.xml','audit_artifacts/readonly_credentials/test_broker.py'], plugins=[isolation]))"
            if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_READ_KEY_REGRESSION_FAILED' }
          } finally { Pop-Location }

      - name: Signed same-account ledger, forgery, replay, concurrency adversarial Mock E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:POA_BINDING_PRODUCT
          try {
            python -B -c "import sys;sys.path.insert(0,'release_checks');import isolation,pytest;sys.exit(pytest.main(['-q','--tb=short','-p','no:cacheprovider','--confcutdir=audit_artifacts/readonly_credentials','--junitxml=immutable-binding.xml','audit_artifacts/readonly_credentials/test_immutable_binding.py'], plugins=[isolation]))"
            if ($LASTEXITCODE -ne 0) { throw 'IMMUTABLE_BINDING_ADVERSARIAL_FAILED' }
          } finally { Pop-Location }

      - name: Reverify product unchanged; operations fail closed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:POA_BINDING_PRODUCT
          if ((git -C $root rev-parse HEAD).Trim() -ne 'ad88384b8b6030c1109843b09b6761395b3f2d1c') { throw 'PRODUCT_COMMIT_DRIFT' }
          if ((git -C $root rev-parse 'HEAD^{tree}').Trim() -ne '663c82e1134f592beb9c8bc652daccc7b2185975') { throw 'PRODUCT_TREE_DRIFT' }
          if (@(git -C $root diff --name-only).Count -ne 0) { throw 'PRODUCT_SOURCE_MUTATION' }
          Write-Host 'P0_PRODUCT_SOURCE_UNCHANGED=PASS'
          Write-Host 'MOCK_ED25519_DUAL_SIGNER_CHAIN=TESTED'
          Write-Host 'REAL_SAME_VENUE_ACCOUNT=UNVERIFIED'
          Write-Host 'TRUST_ROOT_CUSTODY_AND_EXTERNAL_WORM=UNVERIFIED'
          Write-Host 'PRODUCTION_BINDING_AUTHORITY=BLOCKED'
          Write-Host 'LIVE_EXCHANGE_NETWORK_AND_ORDERS=NOT_USED'

      - name: Upload mock JUnit evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-binding-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/poa-p0-account-binding-product/read-keys.xml
            ${{ runner.temp }}/poa-p0-account-binding-product/immutable-binding.xml
          if-no-files-found: ignore
