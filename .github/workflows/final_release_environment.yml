name: Final release isolated Ubuntu VM audit
on:
  push:
    branches: [release/poa-final-20261105]
permissions:
  contents: read
jobs:
  vm-capability:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Verify isolated guest boot prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test -c /dev/kvm
          sudo test -r /dev/kvm
          test "$(ps -p 1 -o comm=)" = systemd
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
          qemu-system-x86_64 --version | head -1
          qemu-img --version | head -1
          echo 'ISOLATED_VM_PREREQUISITES=PASS; NOT_AN_INSTALL_E2E_RESULT'
