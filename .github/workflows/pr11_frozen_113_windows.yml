name: POA PR11 frozen-tree 113-case Windows offline audit

on:
  pull_request:
    branches: [ci/verify-pr5-main-4768f3e-20261107]
    paths:
      - '.github/workflows/pr11_frozen_113_windows.yml'

permissions:
  contents: read

jobs:
  windows-synthetic-offline:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      POA_EXCHANGE_FILL_CONFIRMATION_ENABLED: 'false'
      VERIFIED_DISCORD_ALERTS: 'false'
      DISCORD_OUTBOX_ENABLED: 'false'
    steps:
      - name: Disable newline rewriting before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ad88384b8b6030c1109843b09b6761395b3f2d1c
          fetch-depth: 0
          persist-credentials: false
      - name: Assert immutable PR11 test merge commit and Git Tree
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_sha" = "ad88384b8b6030c1109843b09b6761395b3f2d1c"
          test "$actual_tree" = "663c82e1134f592beb9c8bc652daccc7b2185975"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "PR11_PINNED_COMMIT=$actual_sha"
          echo "PR11_PINNED_TREE=$actual_tree"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pin immutable PR4 product without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pinned = Join-Path $env:RUNNER_TEMP 'poa-pr4-pinned'
          git worktree add --detach $pinned bf6e66e259c7ebbd5099e78b24089caa94936ec9
          if ($LASTEXITCODE -ne 0) { throw 'Cannot checkout pinned product' }
          Copy-Item 'audit_artifacts/readonly_audit_v2/poa_readonly_audit_v2.py' (Join-Path $pinned 'poa_readonly_audit_v2.py')
          "POA_AUDIT_PINNED=$pinned" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run Windows audit v2 smoke and negative tests (no API/secrets)
        shell: pwsh
        run: |
          python -B audit_artifacts/readonly_audit_v2/test_windows_audit_v2.py --pinned-root "$env:POA_AUDIT_PINNED"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic audit smoke failed' }
      # Dependency downloads finish before the offline audit hook is installed.
      - name: Install the exact PR4 runtime for genuine POA functions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install pip==26.3 setuptools==84.2.1
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare pip' }
          python -m pip install -r (Join-Path $env:POA_AUDIT_PINNED 'requirements.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install product dependencies' }
          python -m pip install pytest==9.1.1 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install isolated offline test tools' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency conflict' }
      - name: Genuine POA ReadHost validate and Discord render, offline (49 cases)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'release_checks/test_readonly_audit_v2_real.py' (Join-Path $env:POA_AUDIT_PINNED 'release_checks/test_readonly_audit_v2_real.py')
          Push-Location $env:POA_AUDIT_PINNED
          try {
            # The repo's existing isolation plugin installs socket/DNS and
            # non-temporary SQLite audit hooks before collecting the tests.
            python -B -c "import sys; sys.path.insert(0, 'release_checks'); import isolation, pytest; sys.exit(pytest.main(['--confcutdir=release_checks','-p','no:cacheprovider','-q','--tb=short','--junitxml=readonly-v2-real.xml','release_checks/test_readonly_audit_v2_real.py'], plugins=[isolation]))"
            if ($LASTEXITCODE -ne 0) { throw 'Real POA offline audit failed; check pytest log' }
          } finally {
            Pop-Location
          }
      - name: Real POA to Discord PreparedRequest E2E (no sockets, synthetic HTTP endpoint)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'release_checks/test_discord_wire_e2e.py' (Join-Path $env:POA_AUDIT_PINNED 'release_checks/test_discord_wire_e2e.py')
          Push-Location $env:POA_AUDIT_PINNED
          try {
            python -B -c "import sys; sys.path.insert(0, 'release_checks'); import isolation, pytest; sys.exit(pytest.main(['--confcutdir=release_checks','-p','no:cacheprovider','-q','--tb=short','--junitxml=readonly-v2-discord-e2e.xml','release_checks/test_discord_wire_e2e.py'], plugins=[isolation]))"
            if ($LASTEXITCODE -ne 0) { throw 'Actual DiscordSender/Requests offline wire E2E failed' }
          } finally {
            Pop-Location
          }
      - name: Upload Windows synthetic and real source test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poa-pr5-windows-real-evidence
          path: |
            ${{ runner.temp }}/poa-pr4-pinned/readonly-v2-real.xml
            ${{ runner.temp }}/poa-pr4-pinned/readonly-v2-discord-e2e.xml
          if-no-files-found: ignore
