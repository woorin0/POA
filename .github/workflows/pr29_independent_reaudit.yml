name: POA PR29 independent security re-audit cache FD child process Windows Ubuntu
on:
  pull_request:
    branches: [feat/vultr-integrated-role-boundary-b-20261108]
    paths:
      - 'poa_runtime/**'
      - 'poa_stage/**'
      - 'tests/test_pr_b_sealed_roles.py'
      - 'tests/test_pr29_independent_reaudit.py'
      - 'tests/test_poa_runtime_roles.py'
      - 'deployment/poa-stage-sealed.service.candidate'
      - 'deployment/poa-readonly-sealed.service.candidate'
      - 'deployment/PR_B_SEALED_ROLE_CONTRACT.md'
      - 'deployment/PR29_INDEPENDENT_REAUDIT.md'
      - '.github/workflows/pr29_independent_reaudit.yml'
permissions:
  contents: read

jobs:
  sealed-role-offline:
    name: pr29-independent-full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      PR29_FIXED: 89797bd6214011e7b0e3a6f9ab1e96b845773f45
      MAIN_FIXED: c5566c4cc2a4ce716f1f0d66260bd60e4f95546f
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Preserve exact Git bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install original pinned offline release dependencies
        run: |
          python -m pip install pip==26.3 setuptools==84.2.1
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 pytest-subtests pytest-asyncio pytest-cov cryptography PyYAML
          python -m pip check
      - name: Audit installed dependencies without suppressions
        shell: bash
        run: |
          python -m pip freeze --all > installed-freeze.txt
          python -m venv .audit-tool
          if [ "$RUNNER_OS" = "Windows" ]; then TOOL=.audit-tool/Scripts/python; else TOOL=.audit-tool/bin/python; fi
          "$TOOL" -m pip install pip==26.3 setuptools==84.2.1 pip-audit==2.10.1
          "$TOOL" -m pip_audit --no-deps --disable-pip -r installed-freeze.txt
      - name: Exact PR29 parent and complete protected source conservation
        shell: python
        run: |
          import os,subprocess
          from pathlib import Path
          parent=os.environ["PR29_FIXED"]
          main=os.environ["MAIN_FIXED"]
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()==os.environ["CANDIDATE_SHA"]
          assert subprocess.check_output(["git","rev-parse",parent],text=True).strip()==parent
          assert subprocess.check_output(["git","rev-parse",main],text=True).strip()==main
          approved={
            "poa_runtime/sealed_boundary.py",
            "poa_runtime/sealed_stage.py",
            "poa_runtime/sealed_readonly.py",
            "tests/test_poa_runtime_roles.py",
            "tests/test_pr_b_sealed_roles.py",
            "tests/test_pr29_independent_reaudit.py",
            "deployment/PR29_INDEPENDENT_REAUDIT.md",
            ".github/workflows/pr29_independent_reaudit.yml",
          }
          changed=set(subprocess.check_output(["git","diff","--name-only",parent,"HEAD"],text=True).splitlines())
          assert changed==approved,("UNAUTHORIZED_SCOPE",sorted(changed^approved))
          protected=["main.py","run.py","exchange","requirements.txt",
                     "release_manifest_sha256.json","deployment/install_once.py",
                     "deployment/build_cloud_config.py","deployment/prepare_ubuntu.py"]
          subprocess.run(["git","diff","--exit-code",main,"HEAD","--",*protected],check=True)
          for file in changed:
            if file.endswith(".py"):compile(Path(file).read_bytes(),file,"exec")
          print("PR29_AUDIT_EXACT_EIGHT_FILES=PASS")
          print("ORIGINAL_MAIN_FINANCE_DB_MANIFEST_API_KEYS=UNCHANGED")
      - name: Parent PR29 attacks plus independent cache FD subprocess Mock E2E
        shell: python
        run: |
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          sys.path.insert(0,str(Path.cwd()/"release_checks"))
          import isolation,pytest
          raise SystemExit(pytest.main([
            "-q","--tb=short","-p","no:cacheprovider",
            "--junitxml=pr-b-sealed.xml",
            "tests/test_vultr_stage.py",
            "tests/test_poa_runtime_roles.py",
            "tests/test_pr_b_sealed_roles.py",
            "tests/test_pr29_independent_reaudit.py",
          ],plugins=[isolation]))
      - name: Original independent release checks
        run: python release_checks/run.py -q --tb=short --junitxml=independent.xml
      - name: Original 72-file manifest and packaging
        run: |
          python release_checks/verify_release.py
          python release_checks/verify_packaging.py
      - name: Original HTTP and shared v1 model contracts
        run: python -m pytest tests/test_http_v1_boundary.py tests/test_dependency_security.py -q --tb=short --junitxml=http.xml
      - name: Original independent four-venue native fill confirmation
        if: runner.os == 'Linux'
        run: python release_checks/run_fill_confirmation.py -q --tb=short --junitxml=fill-confirmation.xml
      - name: Preserve original offline Golden stages 1-3
        run: python tests/run_offline.py
      - name: Original admissions, source pins, notifications, Safe Retry
        run: python -m pytest tests/test_executed_amount_notification.py audit_artifacts/source_pin_gate/test_source_pin_guards.py tests/test_safe_retry.py tests/test_upbit_safe_retry.py audit_artifacts/upbit_krw_v5/test_krw_v5.py -q --tb=short --junitxml=core.xml
      - name: Original full Windows pytest including independent PR29 re-audit
        if: runner.os == 'Windows'
        run: python -m pytest -q --tb=short --ignore=release_checks --ignore=audit_artifacts/readonly_audit_v2 --junitxml=full.xml
      - name: Evidence only - no deploy and no order
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poa-pr29-independent-audit-${{ matrix.os }}
          path: |
            pr-b-sealed.xml
            independent.xml
            http.xml
            core.xml
            full.xml
            fill-confirmation.xml
          if-no-files-found: ignore
