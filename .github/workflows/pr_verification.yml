name: PR #2 Offline Verification

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feat/discord-executed-amount-only-20261103 ]

permissions:
  contents: read

jobs:
  verify-windows:
    name: Offline Verification (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disable AutoCRLF and checkout files as stored
        shell: bash
        run: |
          git config core.autocrlf false
          git rm --cached -r .
          git reset --hard HEAD

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-subtests pytest-asyncio pytest-cov

      - name: Verify Release Manifest (70 Product Files)
        run: |
          python -c "
          import json, hashlib
          with open('release_manifest_sha256.json', 'r', encoding='utf-8') as f:
              manifest = json.load(f)
          mismatches = []
          for entry in manifest:
              path = entry['Path']
              expected_hash = entry['SHA256'].lower()
              expected_bytes = entry['Bytes']
              data = open(path, 'rb').read()
              actual_hash = hashlib.sha256(data).hexdigest()
              actual_bytes = len(data)
              if actual_hash != expected_hash or actual_bytes != expected_bytes:
                  mismatches.append((path, expected_hash, actual_hash))
          assert not mismatches, f'Manifest mismatches: {mismatches}'
          print(f'All {len(manifest)} product files match manifest perfectly!')
          "

      - name: Run Offline Golden Runner (Stage 1-3)
        run: |
          python tests/run_offline.py

      - name: Run Required Security & PnL Gates
        run: |
          python -m pytest tests/test_executed_amount_notification.py audit_artifacts/source_pin_gate/test_source_pin_guards.py tests/test_safe_retry.py -q --tb=short

      - name: Run Full Pytest Regression
        run: |
          python -m pytest -q --tb=short

  verify-ubuntu:
    name: Offline Verification (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-subtests pytest-asyncio pytest-cov

      - name: Run Offline Golden Runner
        run: |
          python tests/run_offline.py

      - name: Run Executed Amount Contract Tests
        run: |
          python -m pytest tests/test_executed_amount_notification.py tests/test_safe_retry.py -q --tb=short
