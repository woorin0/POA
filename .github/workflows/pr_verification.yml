name: Release safety offline verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Preserve exact Git bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      # Package downloads happen before the test network tripwire is enabled.
      - name: Install isolated test dependencies
        run: |
          python -m pip install pip==26.3 setuptools==84.2.1
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 pytest-subtests pytest-asyncio pytest-cov cryptography PyYAML
          python -c "import importlib.metadata as m; print('SETUPTOOLS_VERSION=' + m.version('setuptools')); assert m.version('setuptools') == '84.2.1'"
          python -m pip check
      - name: Audit complete installed Python environment (no suppressions)
        shell: bash
        run: |
          python -m pip freeze --all > installed-freeze.txt
          python -m venv .audit-tool
          if [ "$RUNNER_OS" = "Windows" ]; then TOOL=.audit-tool/Scripts/python; else TOOL=.audit-tool/bin/python; fi
          "$TOOL" -m pip install pip==26.3 setuptools==84.2.1 pip-audit==2.10.1
          "$TOOL" -m pip_audit --no-deps --disable-pip -r installed-freeze.txt
      - name: Independent Ed25519, amount, admission and installer gates (no legacy bridge)
        run: python release_checks/run.py -q --tb=short --junitxml=independent.xml
      - name: Enable subprocess network and operating DB isolation
        shell: python
        run: |
          import os
          from pathlib import Path
          paths = [Path.cwd()/'audit_artifacts', Path.cwd()/'tests', Path.cwd()]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('PYTHONPATH='+os.pathsep.join(map(str, paths))+'\n')
      - name: Manifest and exact protected application source
        run: |
          python release_checks/verify_release.py
          python release_checks/verify_packaging.py
      - name: Original 65 HTTP and shared v1 model contracts
        run: python -m pytest tests/test_http_v1_boundary.py tests/test_dependency_security.py -q --tb=short --junitxml=http.xml
      - name: Independent four-venue native fill confirmation
        if: runner.os == 'Linux'
        run: python release_checks/run_fill_confirmation.py -q --tb=short --junitxml=fill-confirmation.xml
      - name: Preserve Offline Golden stages 1-3 and offline regression suites
        run: python tests/run_offline.py
      - name: Admission, frozen wire, source pins and Safe Retry
        run: python -m pytest tests/test_executed_amount_notification.py audit_artifacts/source_pin_gate/test_source_pin_guards.py tests/test_safe_retry.py tests/test_upbit_safe_retry.py audit_artifacts/upbit_krw_v5/test_krw_v5.py -q --tb=short --junitxml=core.xml
      - name: Full Windows regression
        if: runner.os == 'Windows'
        run: python -m pytest -q --tb=short --junitxml=full.xml
      - name: Upload test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.os }}
          path: |
            independent.xml
            core.xml
            full.xml
            fill-confirmation.xml
            http.xml
          if-no-files-found: ignore
