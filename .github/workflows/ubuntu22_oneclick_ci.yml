name: POA Vultr Ubuntu22 one-click boot and finance-source regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment/ubuntu22_oneclick.py'
      - 'deployment/POA_VULTR_ONECLICK_USER_DATA.yaml'
      - 'deployment/POA_VULTR_ONECLICK.md'
      - 'tests/test_ubuntu22_oneclick.py'
      - 'deployment/recover_failed_pocketbase_stage.py'
      - 'tests/test_recover_failed_pocketbase_stage.py'
      - 'deployment/poa_vultr_install_v3.py'
      - 'deployment/POA_VULTR_10_SERVERS_FIXED_USER_DATA.yaml'
      - 'tests/test_poa_vultr_install_v3.py'
      - 'tests/test_ubuntu22_operational.py'
      - '.github/workflows/ubuntu22_oneclick_ci.yml'
permissions:
  contents: read
jobs:
  oneclick:
    name: One-click installer mock-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - name: Preserve source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify no original order/finance/data installer code changed
        shell: bash
        run: |
          git diff --exit-code c5566c4cc2a4ce716f1f0d66260bd60e4f95546f HEAD -- main.py run.py exchange requirements.txt release_checks deployment/install_once.py deployment/prepare_ubuntu.py
      - name: Install offline pytest only
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: One-click boot, auto hostname, secret handling and HTTPS mock regression
        run: python -m pytest -q tests/test_ubuntu22_oneclick.py tests/test_recover_failed_pocketbase_stage.py tests/test_poa_vultr_install_v3.py --tb=short --junitxml=oneclick.xml
      - name: Keep existing cloud-init and restore Mock E2E
        run: python -m pytest -q tests/test_ubuntu22_operational.py --tb=short --junitxml=operational.xml
      - name: Cloud-init exact stage source and no order calls
        shell: python
        run: |
          from pathlib import Path
          import ast,yaml
          source=Path('deployment/POA_VULTR_ONECLICK_USER_DATA.yaml').read_text(encoding='utf-8')
          assert source.startswith('#cloud-config\n')
          obj=yaml.safe_load(source)
          embedded={x['path']:x for x in obj['write_files']}
          code=embedded['/usr/local/lib/poa/ubuntu22_oneclick.py']['content']
          ast.parse(code)
          assert code==Path('deployment/ubuntu22_oneclick.py').read_text(encoding='utf-8')
          assert len(source.encode('utf-8')) < 16000
          assert not any('order' in str(x).lower() for x in obj['runcmd'])
          print('ONECLICK_FILE=PASS; PROTECTED_ORDER_SOURCE=UNCHANGED; REAL_ORDERS_NOT_SENT')
      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poa-oneclick-${{ matrix.os }}
          path: |
            oneclick.xml
            operational.xml
          if-no-files-found: ignore
