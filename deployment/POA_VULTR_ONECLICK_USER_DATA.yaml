#cloud-config
# =============================================================================
# POA / Vultr Ubuntu 22.04 - One-click installer
# =============================================================================
# [EDIT HERE] Change only the values in the first write_files > content block.
#   - PASSWORD: "AUTO" generates a unique webhook password; or enter your own.
#   - DISCORD_WEBHOOK_URL: replace the SET_... text with your new webhook URL.
#   - EXCHANGE: fill one or more KEY + SECRET pairs. Unused fields stay "".
#   - OKX/BITGET require PASSPHRASE if used.
#   - domain: "AUTO" uses server-IP.sslip.io; or enter your own FQDN.
# Do not paste your filled-in User Data into GitHub or public chats.
# =============================================================================
